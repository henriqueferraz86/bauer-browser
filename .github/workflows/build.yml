name: Build Bauer Browser

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release
        env:
          CARGO_TARGET_DIR: D:\cargo-target

      - uses: actions/upload-artifact@v4
        with:
          name: bauer-browser-windows-x64
          path: D:\cargo-target\release\bauer-browser.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System deps (WebKitGTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev pkg-config \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release
        env:
          CARGO_TARGET_DIR: /tmp/cargo-target   # override Windows path in .cargo/config.toml

      - uses: actions/upload-artifact@v4
        with:
          name: bauer-browser-linux-x64
          path: /tmp/cargo-target/release/bauer-browser
          if-no-files-found: error
          retention-days: 30
