name: Build Bauer Browser

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release
        env:
          # Override the local target-dir from .cargo/config.toml
          CARGO_TARGET_DIR: D:\cargo-target

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bauer-browser-windows-x64
          path: D:\cargo-target\release\bauer-browser.exe
          if-no-files-found: error
          retention-days: 30
