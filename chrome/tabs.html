<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg:          #1e2030;
  --tabbar-bg:   #16181f;
  --surface:     #2a2d3e;
  --text:        #c0caf5;
  --text-muted:  #7982a9;
  --accent:      #7aa2f7;
  --hover:       rgba(192,202,245,0.09);
  --hover-strong:rgba(192,202,245,0.15);
  --danger:      #f7768e;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  background: var(--tabbar-bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ── Horizontal (default) ─────────────────────────────── */
#tabbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 8px 0;
  height: 100%;
  overflow: hidden;
}

.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 8px 0 12px;
  height: 32px;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  max-width: 200px;
  min-width: 90px;
  color: var(--text-muted);
  transition: background .12s, color .12s;
  flex-shrink: 1;
}
.tab:hover  { background: var(--hover); color: var(--text); }
.tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.35); }

.tab-favicon {
  width: 14px; height: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; opacity: .85;
}
.tab-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tab-close {
  background: none; border: none; color: inherit; cursor: pointer;
  font-size: 14px; width: 18px; height: 18px; line-height: 1;
  border-radius: 50%; opacity: 0.55; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s, opacity .1s;
}
.tab-close:hover { opacity: 1; background: var(--hover-strong); color: var(--danger); }

#btn-new-tab {
  background: none; border: none; color: var(--text-muted);
  font-size: 17px; cursor: pointer; width: 30px; height: 30px;
  border-radius: 50%; flex-shrink: 0; margin-left: 2px;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s;
}
#btn-new-tab:hover:not(:disabled) { color: var(--text); background: var(--hover); }
#btn-new-tab:disabled { opacity: 0.25; cursor: not-allowed; }

/* ── Vertical (body.vertical) ─────────────────────────── */
body.vertical #tabbar {
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  padding: 8px;
  height: 100%;
  overflow-y: auto;
}
body.vertical .tab {
  width: 100%;
  max-width: none;
  min-width: 0;
  height: 36px;
  flex-shrink: 0;
}
body.vertical #btn-new-tab {
  width: 100%;
  border-radius: 8px;
  height: 34px;
  margin-left: 0;
  margin-top: 2px;
  font-size: 15px;
}
body.vertical #btn-new-tab::after {
  content: " Nova aba";
  font-size: 12px;
}
</style>
</head>
<body>

<div id="tabbar">
  <button id="btn-new-tab" title="New Tab (Ctrl+T)" onclick="newTabClick()">＋</button>
</div>

<script>
function send(action, extra) {
  var msg = Object.assign({ action: action }, extra || {});
  try { window.ipc.postMessage(JSON.stringify(msg)); } catch(e) {}
}

function newTabClick() {
  if (!document.getElementById('btn-new-tab').disabled) send('newTab');
}

// Switch between horizontal and vertical layout (called from Rust)
function setTabLayout(mode) {
  document.body.classList.toggle('vertical', mode === 'vertical');
}

// Rebuild tab strip; maxTabs enables/disables the + button (spec 3.11)
function updateTabs(tabs, activeIndex, maxTabs) {
  var bar = document.getElementById('tabbar');
  bar.querySelectorAll('.tab').forEach(function(t) { t.remove(); });

  tabs.forEach(function(tab, i) {
    var div = document.createElement('div');
    div.className = 'tab' + (i === activeIndex ? ' active' : '');
    div.onclick = function() { send('switchTab', { index: i }); };

    var fav = document.createElement('span');
    fav.className = 'tab-favicon';
    fav.textContent = '🌐';
    div.appendChild(fav);

    var title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = tab.title || tab.url || 'New Tab';
    div.appendChild(title);

    var close = document.createElement('button');
    close.className = 'tab-close';
    close.textContent = '×';
    close.title = 'Close tab';
    close.onclick = function(e) { e.stopPropagation(); send('closeTab', { index: i }); };
    div.appendChild(close);

    bar.insertBefore(div, document.getElementById('btn-new-tab'));
  });

  var btn = document.getElementById('btn-new-tab');
  var atLimit = maxTabs !== undefined && tabs.length >= maxTabs;
  btn.disabled = atLimit;
  btn.title = atLimit ? 'Maximum tabs reached (' + maxTabs + ')' : 'New Tab (Ctrl+T)';
}

// Keyboard shortcuts (fire when the tab strip WebView has focus)
document.addEventListener('keydown', function(e) {
  if (e.altKey  && e.key === 'ArrowLeft')  { send('back');    e.preventDefault(); }
  if (e.altKey  && e.key === 'ArrowRight') { send('forward'); e.preventDefault(); }
  if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) { send('reload'); e.preventDefault(); }
  if (e.ctrlKey && e.key === 't') { send('newTab'); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'w') { send('closeTab', { index: -1 }); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'Tab') {
    e.shiftKey ? send('prevTab') : send('nextTab');
    e.preventDefault();
  }
});
</script>
</body>
</html>
