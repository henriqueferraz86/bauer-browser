<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg:          #1e2030;
  --tabbar-bg:   #16181f;
  --surface:     #2a2d3e;
  --surface-2:   #383c58;
  --text:        #c0caf5;
  --text-muted:  #7982a9;
  --accent:      #7aa2f7;
  --hover:       rgba(192,202,245,0.09);
  --hover-strong:rgba(192,202,245,0.15);
  --danger:      #f7768e;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  height: 92px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── Tab strip (Edge-style floating tabs) ─────────────── */
#tabbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 8px 0;
  height: 40px;
  background: var(--tabbar-bg);
  flex-shrink: 0;
  overflow: hidden;
}

.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 8px 0 12px;
  height: 32px;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  max-width: 200px;
  min-width: 90px;
  color: var(--text-muted);
  transition: background .12s, color .12s;
  flex-shrink: 1;
  position: relative;
}
.tab:hover            { background: var(--hover); color: var(--text); }
.tab.active           { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.tab.active::after {
  content: ""; position: absolute; left: 8px; right: 8px; bottom: -6px; height: 0;
}

.tab-favicon {
  width: 14px; height: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; opacity: .85;
}

.tab-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tab-close {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  font-size: 14px;
  width: 18px; height: 18px;
  line-height: 1;
  border-radius: 50%;
  opacity: 0.55;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s, opacity .1s;
}
.tab-close:hover { opacity: 1; background: var(--hover-strong); color: var(--danger); }

#btn-new-tab {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 17px;
  cursor: pointer;
  width: 30px; height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  margin-left: 2px;
  transition: background .12s, color .12s;
}
#btn-new-tab:hover:not(:disabled) { color: var(--text); background: var(--hover); }
#btn-new-tab:disabled { opacity: 0.25; cursor: not-allowed; }

/* ── Toolbar ──────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 8px;
  height: 52px;
  flex-shrink: 0;
}

/* Circular icon buttons (nav + actions) */
button.icon {
  background: transparent;
  color: var(--text);
  border: none;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .12s;
}
button.icon:hover  { background: var(--hover); }
button.icon:active { background: var(--hover-strong); }
button.icon:disabled { opacity: 0.3; cursor: default; background: transparent; }

.tb-gap { width: 4px; flex-shrink: 0; }

/* Address pill */
#url-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 18px;
  height: 36px;
  padding: 0 14px;
  margin: 0 6px;
  transition: border-color .12s, box-shadow .12s, background .12s;
}
#url-wrap:focus-within {
  background: #20232f;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(122,162,247,.18);
}
#url-lead { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
#url {
  flex: 1;
  background: transparent;
  color: var(--text);
  border: none;
  height: 100%;
  font-size: 13px;
  outline: none;
}
#url::placeholder { color: var(--text-muted); }

/* Mode selector */
#mode {
  background: transparent;
  color: var(--text);
  border: none;
  border-radius: 16px;
  padding: 0 6px;
  height: 32px;
  font-size: 12px;
  cursor: pointer;
  transition: background .12s;
}
#mode:hover { background: var(--hover); }

#ram {
  font-size: 11px;
  min-width: 56px;
  text-align: right;
  color: var(--text-muted);
  padding-left: 4px;
  flex-shrink: 0;
}
#ram.alert { color: var(--danger); }

/* Active states */
#btn-reader.active   { background: rgba(122,162,247,.22); color: var(--accent); }
#btn-bookmark.bookmarked { color: #e0af68; }

/* Agent pill button keeps a label */
#btn-agent {
  width: auto;
  border-radius: 17px;
  padding: 0 12px;
  font-size: 12px;
  gap: 4px;
}

/* ── Download toast ───────────────────────────────────── */
#dl-toast {
  display: none;
  position: fixed;
  bottom: 0; left: 0;
  padding: 6px 14px;
  background: #1a1c2a;
  border: 1px solid #414868;
  border-radius: 0 8px 0 0;
  font-size: 12px;
  color: var(--text);
  max-width: 280px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  z-index: 9997;
}
#dl-toast.done  { border-color: #9ece6a; color: #9ece6a; }
#dl-toast.error { border-color: var(--danger); color: var(--danger); }

/* ── Agent result panel ───────────────────────────────── */
#agent-panel {
  display: none;
  position: fixed;
  bottom: 0; right: 0;
  width: 380px;
  max-height: 260px;
  background: #1a1c2a;
  border: 1px solid #414868;
  border-radius: 10px 0 0 0;
  padding: 12px;
  font-size: 13px;
  color: var(--text);
  overflow-y: auto;
  z-index: 9999;
  box-shadow: -4px -4px 20px rgba(0,0,0,.4);
}
#agent-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: 600;
  color: var(--accent);
}
#agent-close { cursor: pointer; color: var(--text-muted); }
#agent-close:hover { color: var(--text); }
#agent-text  { white-space: pre-wrap; line-height: 1.6; }
</style>
</head>
<body>

<!-- Tab strip -->
<div id="tabbar">
  <!-- Tabs injected by updateTabs() -->
  <button id="btn-new-tab" title="New Tab (Ctrl+T)" onclick="newTabClick()">＋</button>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="icon" title="Back (Alt+←)"    onclick="send('back')">←</button>
  <button class="icon" title="Forward (Alt+→)" onclick="send('forward')">→</button>
  <button class="icon" title="Reload (F5)"     onclick="send('reload')">↺</button>
  <button class="icon" title="Home"            onclick="send('home')">🏠</button>

  <div id="url-wrap">
    <span id="url-lead">🔍</span>
    <input id="url" type="text" list="url-history" placeholder="Pesquisar ou digitar endereço"
           onkeydown="if(event.key==='Enter')navigate()"
           onfocus="this.select()" />
    <datalist id="url-history"></datalist>
  </div>

  <select id="mode" title="Page mode" onchange="send('setMode',{mode:this.value})">
    <option value="lite">🌿 Lite</option>
    <option value="normal" selected>⚡ Normal</option>
    <option value="full">🔥 Full</option>
  </select>

  <span class="tb-gap"></span>

  <button class="icon" id="btn-reader"   title="Reader Mode"             onclick="send('readerMode')">📖</button>
  <button class="icon" id="btn-bookmark" title="Add to bookmarks (Ctrl+D)" onclick="bookmarkClick()">☆</button>
  <button class="icon" id="btn-bookmark-list" title="Show bookmarks"     onclick="send('showBookmarks')">≡</button>
  <button class="icon" id="btn-agent"    title="Summarize with Bauer Agent" onclick="agentClick()">🤖 Resumir</button>

  <span id="ram">-- MB</span>
</div>

<!-- Download toast -->
<div id="dl-toast"></div>

<!-- Agent result -->
<div id="agent-panel">
  <div id="agent-header">
    🤖 Bauer Agent — Resumo
    <span id="agent-close" onclick="document.getElementById('agent-panel').style.display='none'">✕</span>
  </div>
  <div id="agent-text"></div>
</div>

<script>
// ── IPC ─────────────────────────────────────────────────────────────────
function send(action, extra) {
  var msg = Object.assign({ action: action }, extra || {});
  try { window.ipc.postMessage(JSON.stringify(msg)); } catch(e) {}
}

function navigate() {
  var v = document.getElementById('url').value.trim();
  if (v) send('navigate', { url: v });
}

function newTabClick() {
  if (!document.getElementById('btn-new-tab').disabled) send('newTab');
}

function agentClick() {
  var b = document.getElementById('btn-agent');
  b.textContent = '⏳…'; b.disabled = true;
  send('agentSummarize');
}

// ── Reader Mode toggle ────────────────────────────────────────────────────

function setReaderMode(isActive) {
  var btn = document.getElementById('btn-reader');
  btn.classList.toggle('active', isActive);
  btn.title = isActive ? 'Exit Reader Mode' : 'Reader Mode';
}

// ── Downloads (F-04) ─────────────────────────────────────────────────────

var _dlTimer = null;

function showDownload(filename, status) {
  var el = document.getElementById('dl-toast');
  el.className = '';
  clearTimeout(_dlTimer);
  if (status === 'started') {
    el.textContent = '⬇ ' + filename;
    el.style.display = 'block';
  } else if (status === 'done') {
    el.textContent = '✓ ' + filename;
    el.className = 'done';
    el.style.display = 'block';
    _dlTimer = setTimeout(function() { el.style.display = 'none'; }, 4000);
  } else {
    el.textContent = '✗ ' + filename;
    el.className = 'error';
    el.style.display = 'block';
    _dlTimer = setTimeout(function() { el.style.display = 'none'; }, 4000);
  }
}

// ── Bookmarks (F-03) ─────────────────────────────────────────────────────

var _bookmarked = false;

function bookmarkClick() {
  if (_bookmarked) {
    send('removeBookmark', { url: document.getElementById('url').value });
  } else {
    send('saveBookmark');
  }
}

// Called from Rust — update ☆/★ state of the bookmark button
function setBookmarkState(isBookmarked) {
  _bookmarked = isBookmarked;
  var btn = document.getElementById('btn-bookmark');
  btn.textContent = isBookmarked ? '★' : '☆';
  btn.title = isBookmarked ? 'Remove from bookmarks (Ctrl+D)' : 'Add to bookmarks (Ctrl+D)';
  btn.classList.toggle('bookmarked', isBookmarked);
}

// ── Called from Rust ─────────────────────────────────────────────────────

// Populate datalist with history URLs on startup (F-02)
function setHistory(urls) {
  var dl = document.getElementById('url-history');
  dl.innerHTML = '';
  urls.forEach(function(url) {
    var opt = document.createElement('option');
    opt.value = url;
    dl.appendChild(opt);
  });
}

// Prepend a new URL to the datalist after navigation (F-02)
function addToHistory(url) {
  var dl = document.getElementById('url-history');
  var existing = Array.from(dl.options).find(function(o) { return o.value === url; });
  if (existing) { dl.removeChild(existing); }
  var opt = document.createElement('option');
  opt.value = url;
  dl.insertBefore(opt, dl.firstChild);
}

function setUrlBar(url) {
  document.getElementById('url').value = url;
}

function setRam(mb, alert) {
  var el = document.getElementById('ram');
  el.textContent = mb.toFixed(0) + ' MB';
  el.className = alert ? 'alert' : '';
}

function setMode(mode) {
  document.getElementById('mode').value = mode;
}

function showAgent(text) {
  document.getElementById('agent-text').textContent = text;
  document.getElementById('agent-panel').style.display = 'block';
  var b = document.getElementById('btn-agent');
  b.textContent = '🤖 Resumir'; b.disabled = false;
}

// Rebuild tab bar; maxTabs enables/disables the + button (spec 3.11)
function updateTabs(tabs, activeIndex, maxTabs) {
  var bar = document.getElementById('tabbar');
  bar.querySelectorAll('.tab').forEach(function(t) { t.remove(); });

  tabs.forEach(function(tab, i) {
    var div = document.createElement('div');
    div.className = 'tab' + (i === activeIndex ? ' active' : '');
    div.onclick = function() { send('switchTab', { index: i }); };

    var fav = document.createElement('span');
    fav.className = 'tab-favicon';
    fav.textContent = '🌐';
    div.appendChild(fav);

    var title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = tab.title || tab.url || 'New Tab';
    div.appendChild(title);

    var close = document.createElement('button');
    close.className = 'tab-close';
    close.textContent = '×';
    close.title = 'Close tab';
    close.onclick = function(e) { e.stopPropagation(); send('closeTab', { index: i }); };
    div.appendChild(close);

    bar.insertBefore(div, document.getElementById('btn-new-tab'));
  });

  // 3.11: visually disable + when at the limit
  var btn = document.getElementById('btn-new-tab');
  var atLimit = maxTabs !== undefined && tabs.length >= maxTabs;
  btn.disabled = atLimit;
  btn.title = atLimit ? 'Maximum tabs reached (' + maxTabs + ')' : 'New Tab (Ctrl+T)';
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.altKey  && e.key === 'ArrowLeft')  { send('back');    e.preventDefault(); }
  if (e.altKey  && e.key === 'ArrowRight') { send('forward'); e.preventDefault(); }
  if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) { send('reload'); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'l') { document.getElementById('url').focus(); e.preventDefault(); }
  if (e.ctrlKey && e.key === 't') {
    if (!document.getElementById('btn-new-tab').disabled) {
      send('newTab'); e.preventDefault();
    }
  }
  if (e.ctrlKey && e.key === 'w') { send('closeTab', { index: -1 }); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'd') { bookmarkClick(); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'Tab') {
    e.shiftKey ? send('prevTab') : send('nextTab');
    e.preventDefault();
  }
});
</script>
</body>
</html>
