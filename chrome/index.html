<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1e2030;
  color: #c0caf5;
  font-family: system-ui, -apple-system, sans-serif;
  height: 92px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── Tab bar (top 36px) ───────────────────────────────── */
#tabbar {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  padding: 6px 8px 0;
  height: 36px;
  background: #16181f;
  flex-shrink: 0;
  overflow: hidden;
}

.tab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 10px 0 12px;
  height: 28px;
  background: #2a2d3e;
  border-radius: 7px 7px 0 0;
  cursor: pointer;
  font-size: 12px;
  max-width: 160px;
  min-width: 80px;
  color: #7982a9;
  border: 1px solid #414868;
  border-bottom: none;
  transition: background .12s;
  flex-shrink: 0;
}
.tab:hover   { background: #383c58; color: #c0caf5; }
.tab.active  { background: #1e2030; color: #c0caf5; border-color: #545c7e; }

.tab-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tab-close {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  font-size: 13px;
  padding: 0 0 0 2px;
  line-height: 1;
  opacity: 0.6;
  flex-shrink: 0;
}
.tab-close:hover { opacity: 1; color: #f7768e; }

#btn-new-tab {
  background: none;
  border: none;
  color: #565f89;
  font-size: 18px;
  cursor: pointer;
  padding: 0 6px;
  height: 28px;
  border-radius: 6px;
  flex-shrink: 0;
  transition: opacity .15s;
}
#btn-new-tab:hover:not(:disabled) { color: #c0caf5; background: #2a2d3e; }
#btn-new-tab:disabled { opacity: 0.25; cursor: not-allowed; }

/* ── Toolbar row (bottom 56px) ────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 8px;
  height: 56px;
  flex-shrink: 0;
}

button.bb {
  background: #2a2d3e;
  color: #c0caf5;
  border: 1px solid #414868;
  border-radius: 7px;
  padding: 0 10px;
  height: 32px;
  cursor: pointer;
  font-size: 15px;
  white-space: nowrap;
  display: flex;
  align-items: center;
}
button.bb:hover  { background: #414868; }
button.bb:active { background: #545c7e; }

#url {
  flex: 1;
  background: #2a2d3e;
  color: #c0caf5;
  border: 1px solid #414868;
  border-radius: 8px;
  padding: 0 12px;
  height: 32px;
  font-size: 13px;
  outline: none;
}
#url:focus   { border-color: #7aa2f7; box-shadow: 0 0 0 2px rgba(122,162,247,.15); }
#url::placeholder { color: #565f89; }

#mode {
  background: #2a2d3e;
  color: #c0caf5;
  border: 1px solid #414868;
  border-radius: 7px;
  padding: 0 8px;
  height: 32px;
  font-size: 12px;
  cursor: pointer;
}

#ram { font-size: 11px; min-width: 58px; text-align: right; color: #565f89; }
#ram.alert { color: #f7768e; }

/* ── Download toast ───────────────────────────────────── */
#dl-toast {
  display: none;
  position: fixed;
  bottom: 0; left: 0;
  padding: 6px 14px;
  background: #1a1c2a;
  border: 1px solid #414868;
  border-radius: 0 8px 0 0;
  font-size: 12px;
  color: #c0caf5;
  max-width: 280px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  z-index: 9997;
}
#dl-toast.done  { border-color: #9ece6a; color: #9ece6a; }
#dl-toast.error { border-color: #f7768e; color: #f7768e; }

/* ── Bookmark button active state ─────────────────────── */
#btn-bookmark.bookmarked { color: #e0af68; }

/* ── Bookmark panel ───────────────────────────────────── */
#bookmark-panel {
  display: none;
  position: fixed;
  top: 92px; right: 0;
  width: 300px;
  max-height: 380px;
  background: #1a1c2a;
  border: 1px solid #414868;
  border-radius: 0 0 0 10px;
  padding: 12px;
  font-size: 13px;
  color: #c0caf5;
  overflow-y: auto;
  z-index: 9998;
  box-shadow: -4px 4px 20px rgba(0,0,0,.4);
}
#bookmark-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: 600;
  color: #7aa2f7;
}
#bookmark-close-btn { cursor: pointer; color: #565f89; }
#bookmark-close-btn:hover { color: #c0caf5; }
.bookmark-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 4px;
  border-radius: 6px;
  cursor: pointer;
  border-bottom: 1px solid #2a2d3e;
}
.bookmark-row:hover { background: #2a2d3e; }
.bookmark-info { flex: 1; overflow: hidden; }
.bookmark-title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bookmark-url   { font-size: 10px; color: #565f89; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bookmark-del {
  background: none; border: none; color: #565f89;
  cursor: pointer; font-size: 14px; padding: 0 4px; flex-shrink: 0;
}
.bookmark-del:hover { color: #f7768e; }
#bookmark-empty { color: #565f89; text-align: center; padding: 20px 0; }

/* ── Agent result panel ───────────────────────────────── */
#agent-panel {
  display: none;
  position: fixed;
  bottom: 0; right: 0;
  width: 380px;
  max-height: 260px;
  background: #1a1c2a;
  border: 1px solid #414868;
  border-radius: 10px 0 0 0;
  padding: 12px;
  font-size: 13px;
  color: #c0caf5;
  overflow-y: auto;
  z-index: 9999;
  box-shadow: -4px -4px 20px rgba(0,0,0,.4);
}
#agent-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: 600;
  color: #7aa2f7;
}
#agent-close { cursor: pointer; color: #565f89; }
#agent-close:hover { color: #c0caf5; }
#agent-text  { white-space: pre-wrap; line-height: 1.6; }
</style>
</head>
<body>

<!-- Tab bar -->
<div id="tabbar">
  <!-- Tabs injected by updateTabs() -->
  <button id="btn-new-tab" title="New Tab (Ctrl+T)" onclick="newTabClick()">＋</button>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="bb" title="Back (Alt+←)"    onclick="send('back')">←</button>
  <button class="bb" title="Forward (Alt+→)" onclick="send('forward')">→</button>
  <button class="bb" title="Reload (F5)"     onclick="send('reload')">↺</button>

  <input id="url" type="text" list="url-history" placeholder="Enter URL or search…"
         onkeydown="if(event.key==='Enter')navigate()"
         onfocus="this.select()" />
  <datalist id="url-history"></datalist>

  <select id="mode" title="Page mode" onchange="send('setMode',{mode:this.value})">
    <option value="lite">🌿 Lite</option>
    <option value="normal" selected>⚡ Normal</option>
    <option value="full">🔥 Full</option>
  </select>

  <button class="bb" title="Reader Mode"            onclick="send('readerMode')">📖</button>
  <button class="bb" id="btn-bookmark" title="Add to bookmarks (Ctrl+D)"
          onclick="bookmarkClick()">☆</button>
  <button class="bb" id="btn-bookmark-list" title="Show bookmarks"
          onclick="toggleBookmarkPanel()">≡</button>
  <button class="bb" id="btn-agent" style="font-size:12px;min-width:88px"
          title="Summarize with Bauer Agent"
          onclick="agentClick()">🤖 Resumir</button>

  <span id="ram">-- MB</span>
</div>

<!-- Download toast -->
<div id="dl-toast"></div>

<!-- Bookmark panel -->
<div id="bookmark-panel">
  <div id="bookmark-header">
    ☆ Favoritos
    <span id="bookmark-close-btn" onclick="document.getElementById('bookmark-panel').style.display='none'">✕</span>
  </div>
  <div id="bookmark-list"></div>
</div>

<!-- Agent result -->
<div id="agent-panel">
  <div id="agent-header">
    🤖 Bauer Agent — Resumo
    <span id="agent-close" onclick="document.getElementById('agent-panel').style.display='none'">✕</span>
  </div>
  <div id="agent-text"></div>
</div>

<script>
// ── IPC ─────────────────────────────────────────────────────────────────
function send(action, extra) {
  var msg = Object.assign({ action: action }, extra || {});
  try { window.ipc.postMessage(JSON.stringify(msg)); } catch(e) {}
}

function navigate() {
  var v = document.getElementById('url').value.trim();
  if (v) send('navigate', { url: v });
}

function newTabClick() {
  if (!document.getElementById('btn-new-tab').disabled) send('newTab');
}

function agentClick() {
  var b = document.getElementById('btn-agent');
  b.textContent = '⏳…'; b.disabled = true;
  send('agentSummarize');
}

// ── Downloads (F-04) ─────────────────────────────────────────────────────

var _dlTimer = null;

function showDownload(filename, status) {
  var el = document.getElementById('dl-toast');
  el.className = '';
  clearTimeout(_dlTimer);
  if (status === 'started') {
    el.textContent = '⬇ ' + filename;
    el.style.display = 'block';
  } else if (status === 'done') {
    el.textContent = '✓ ' + filename;
    el.className = 'done';
    el.style.display = 'block';
    _dlTimer = setTimeout(function() { el.style.display = 'none'; }, 4000);
  } else {
    el.textContent = '✗ ' + filename;
    el.className = 'error';
    el.style.display = 'block';
    _dlTimer = setTimeout(function() { el.style.display = 'none'; }, 4000);
  }
}

// ── Bookmarks (F-03) ─────────────────────────────────────────────────────

var _bookmarked = false;

function bookmarkClick() {
  if (_bookmarked) {
    send('removeBookmark', { url: document.getElementById('url').value });
  } else {
    send('saveBookmark');
  }
}

function toggleBookmarkPanel() {
  var p = document.getElementById('bookmark-panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

// Called from Rust — rebuild the bookmark list panel
function setBookmarks(bookmarks) {
  var list = document.getElementById('bookmark-list');
  list.innerHTML = '';
  if (!bookmarks || bookmarks.length === 0) {
    list.innerHTML = '<div id="bookmark-empty">Nenhum favorito ainda</div>';
    return;
  }
  bookmarks.forEach(function(b) {
    var row = document.createElement('div');
    row.className = 'bookmark-row';
    row.onclick = function() {
      send('navigate', { url: b.url });
      document.getElementById('bookmark-panel').style.display = 'none';
    };
    var info = document.createElement('div');
    info.className = 'bookmark-info';
    var title = document.createElement('div');
    title.className = 'bookmark-title';
    title.textContent = b.title || b.url;
    var url = document.createElement('div');
    url.className = 'bookmark-url';
    url.textContent = b.url;
    info.appendChild(title);
    info.appendChild(url);
    var del = document.createElement('button');
    del.className = 'bookmark-del';
    del.textContent = '×';
    del.title = 'Remove bookmark';
    del.onclick = function(e) { e.stopPropagation(); send('removeBookmark', { url: b.url }); };
    row.appendChild(info);
    row.appendChild(del);
    list.appendChild(row);
  });
}

// Called from Rust — update ☆/★ state of the bookmark button
function setBookmarkState(isBookmarked) {
  _bookmarked = isBookmarked;
  var btn = document.getElementById('btn-bookmark');
  btn.textContent = isBookmarked ? '★' : '☆';
  btn.title = isBookmarked ? 'Remove from bookmarks (Ctrl+D)' : 'Add to bookmarks (Ctrl+D)';
  btn.classList.toggle('bookmarked', isBookmarked);
}

// ── Called from Rust ─────────────────────────────────────────────────────

// Populate datalist with history URLs on startup (F-02)
function setHistory(urls) {
  var dl = document.getElementById('url-history');
  dl.innerHTML = '';
  urls.forEach(function(url) {
    var opt = document.createElement('option');
    opt.value = url;
    dl.appendChild(opt);
  });
}

// Prepend a new URL to the datalist after navigation (F-02)
function addToHistory(url) {
  var dl = document.getElementById('url-history');
  var existing = Array.from(dl.options).find(function(o) { return o.value === url; });
  if (existing) { dl.removeChild(existing); }
  var opt = document.createElement('option');
  opt.value = url;
  dl.insertBefore(opt, dl.firstChild);
}

function setUrlBar(url) {
  document.getElementById('url').value = url;
}

function setRam(mb, alert) {
  var el = document.getElementById('ram');
  el.textContent = mb.toFixed(0) + ' MB';
  el.className = alert ? 'alert' : '';
}

function setMode(mode) {
  document.getElementById('mode').value = mode;
}

function showAgent(text) {
  document.getElementById('agent-text').textContent = text;
  document.getElementById('agent-panel').style.display = 'block';
  var b = document.getElementById('btn-agent');
  b.textContent = '🤖 Resumir'; b.disabled = false;
}

// Rebuild tab bar; maxTabs enables/disables the + button (spec 3.11)
function updateTabs(tabs, activeIndex, maxTabs) {
  var bar = document.getElementById('tabbar');
  bar.querySelectorAll('.tab').forEach(function(t) { t.remove(); });

  tabs.forEach(function(tab, i) {
    var div = document.createElement('div');
    div.className = 'tab' + (i === activeIndex ? ' active' : '');
    div.onclick = function() { send('switchTab', { index: i }); };

    var title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = tab.title || tab.url || 'New Tab';
    div.appendChild(title);

    var close = document.createElement('button');
    close.className = 'tab-close';
    close.textContent = '×';
    close.title = 'Close tab';
    close.onclick = function(e) { e.stopPropagation(); send('closeTab', { index: i }); };
    div.appendChild(close);

    bar.insertBefore(div, document.getElementById('btn-new-tab'));
  });

  // 3.11: visually disable + when at the limit
  var btn = document.getElementById('btn-new-tab');
  var atLimit = maxTabs !== undefined && tabs.length >= maxTabs;
  btn.disabled = atLimit;
  btn.title = atLimit ? 'Maximum tabs reached (' + maxTabs + ')' : 'New Tab (Ctrl+T)';
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.altKey  && e.key === 'ArrowLeft')  { send('back');    e.preventDefault(); }
  if (e.altKey  && e.key === 'ArrowRight') { send('forward'); e.preventDefault(); }
  if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) { send('reload'); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'l') { document.getElementById('url').focus(); e.preventDefault(); }
  if (e.ctrlKey && e.key === 't') {
    if (!document.getElementById('btn-new-tab').disabled) {
      send('newTab'); e.preventDefault();
    }
  }
  if (e.ctrlKey && e.key === 'w') { send('closeTab', { index: -1 }); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'd') { bookmarkClick(); e.preventDefault(); }
});
</script>
</body>
</html>
