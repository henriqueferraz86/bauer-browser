[package]
name    = "bauer-browser"
version = "0.1.0"
edition = "2021"
description = "Lightweight multi-platform browser for BauerOS"

[[bin]]
name = "bauer-browser"
path = "src/main.rs"

[dependencies]
# Windowing + WebView (uses native OS WebView — no engine bundled)
tao     = "0.25"
wry     = "0.37"

# Serialization (IPC messages between chrome HTML and Rust)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Cross-platform process/system info (RAM monitoring)
sysinfo = "0.29"

# HTTP client for Bauer Agent
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Config file (TOML)
toml = "0.7"

# User dirs (~/.bauer-browser)
dirs = "5"

# Logging
chrono = "0.4"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1   # faster dev builds

# ── Windows: no console window in release builds ─────────────────────────────
[target.'cfg(windows)'.dependencies]
# (WebView2 is installed by default on Windows 10 build 1803+ via Windows Update)

# ── Notes ─────────────────────────────────────────────────────────────────────
# If wry/tao version mismatch occurs, check https://github.com/tauri-apps/wry
# for the compatible tao version. They must be updated together.
# wry 0.24 → tao 0.16
# wry 0.28 → tao 0.21
# wry 0.38 → tao 0.28
