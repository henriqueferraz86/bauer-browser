# Bauer Browser — Default Configuration
# DO NOT edit this file. Copy to config/settings.toml and change there.

[browser]
max_tabs                 = 5
default_mode             = "normal"   # "lite" | "normal" | "full"
home_url                 = "https://duckduckgo.com"
ram_alert_mb             = 300        # show warning label when tab exceeds this
idle_tab_timeout_seconds = 0          # 0 = disabled (V2 feature)
window_width             = 1200
window_height            = 800

[blocklists]
block_trackers = true
block_ads      = true

[agent]
enabled          = true
base_url         = "http://localhost:8742"
timeout_seconds  = 10

[logging]
enabled  = true
log_file = "~/.bauer-browser/navigation.log"
